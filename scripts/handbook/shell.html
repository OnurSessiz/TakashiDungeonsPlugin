<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TakashiDungeons — Engineering Handbook</title>
<style>
@page { size: A4; margin: 20mm 18mm 18mm 18mm; }

:root{
  --ink:#1b1a18;
  --ink2:#3d3a36;
  --mut:#6d675f;
  --rule:#d9d4cb;
  --rule2:#ece7de;
  --gold:#b8791f;
  --gold-l:#f4b13c;
  --deep:#171512;
  --paper:#ffffff;
  --wash:#faf7f1;
  --wash2:#f4efe5;
  --code-bg:#1c1a17;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Cambria,Georgia,"Times New Roman",serif;
  font-size:10.2pt;
  line-height:1.56;
  color:var(--ink);
  background:var(--paper);
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
  hyphens:auto;
  text-align:justify;
}

/* ---------------------------------------------------------------- cover */
.cover{
  page-break-after:always;
  height:255mm;
  position:relative;
  background:var(--deep);
  color:#f6f1e6;
  margin:0;
  padding:30mm 18mm 18mm 18mm;
  overflow:hidden;
  border-radius:2mm;
}
.cover .glow{
  position:absolute;right:-60mm;top:-40mm;width:170mm;height:170mm;border-radius:50%;
  background:radial-gradient(circle,rgba(244,177,60,.20),rgba(244,177,60,0) 62%);
}
.cover .grid{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:14mm 14mm;
}
.cover .inner{position:relative}
.cover .kicker{
  font-family:"Segoe UI",Arial,sans-serif;font-size:8.6pt;letter-spacing:.34em;
  text-transform:uppercase;color:var(--gold-l);margin-bottom:14mm;
}
.cover h1.title{
  font-family:"Segoe UI Semibold","Segoe UI",Arial,sans-serif;
  font-size:42pt;line-height:1.14;margin:0 0 5mm 0;letter-spacing:-.02em;padding-bottom:2mm;
  background:linear-gradient(100deg,#ffd45e,#ff8a3d);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  border:0;text-align:left;
}
.cover h2.sub{
  font-family:"Segoe UI Light","Segoe UI",Arial,sans-serif;font-weight:300;
  font-size:16pt;line-height:1.35;margin:0 0 4mm 0;color:#e8e1d3;border:0;padding:0;
}
.cover .lede{font-size:11pt;color:#b9b1a4;max-width:132mm;line-height:1.6;margin-top:8mm}
.cover .rulebar{width:38mm;height:2.4pt;background:linear-gradient(90deg,#ffd45e,#ff8a3d);margin:9mm 0}
.cover .meta{
  position:absolute;left:18mm;right:18mm;bottom:16mm;
  font-family:"Segoe UI",Arial,sans-serif;font-size:8.4pt;color:#8d8578;
  display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.14);
  padding-top:4mm;letter-spacing:.06em;
}
.cover .chips{margin-top:10mm;font-family:"Segoe UI",Arial,sans-serif;font-size:8.2pt}
.cover .chip{
  display:inline-block;border:1px solid rgba(244,177,60,.42);color:#f0d9a8;
  border-radius:2mm;padding:1.2mm 3mm;margin:0 2mm 2mm 0;letter-spacing:.08em;
}

/* ---------------------------------------------------------------- toc */
.tocpage{page-break-after:always}
.tocpage h2{border:0;margin:0 0 8mm 0;padding:0;font-size:20pt}
.toc1{
  display:flex;align-items:baseline;gap:2mm;
  font-family:"Segoe UI Semibold","Segoe UI",Arial,sans-serif;font-size:10pt;
  margin:6mm 0 2mm 0;color:var(--deep);text-transform:uppercase;letter-spacing:.08em;
}
.toc2{display:flex;align-items:baseline;gap:2mm;font-size:9.6pt;margin:.9mm 0;color:var(--ink2)}
.toc2 .tt{padding-left:6mm}
.toc1 .tl{color:var(--gold);font-weight:700;letter-spacing:.06em}
.toc2 .tl{display:none}
.dots{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-1mm)}
.tp{width:5ch;text-align:right;font-family:"Segoe UI",Arial,sans-serif;font-size:8.6pt;color:var(--mut);font-variant-numeric:tabular-nums}
.toc1 .tp{color:var(--gold)}

/* ---------------------------------------------------------------- headings */
h1{
  font-family:"Segoe UI Semibold","Segoe UI",Arial,sans-serif;
  font-size:23pt;line-height:1.1;letter-spacing:-.015em;color:var(--deep);
  margin:0 0 7mm 0;padding:0 0 4mm 0;border-bottom:2.6pt solid var(--gold);
  page-break-before:always;page-break-after:avoid;text-align:left;
}
h1.first{page-break-before:auto}
h2{
  font-family:"Segoe UI Semibold","Segoe UI",Arial,sans-serif;
  font-size:14.4pt;line-height:1.22;color:var(--deep);
  margin:9mm 0 3.4mm 0;padding-bottom:1.6mm;border-bottom:1px solid var(--rule);
  page-break-after:avoid;text-align:left;
}
h3{
  font-family:"Segoe UI Semibold","Segoe UI",Arial,sans-serif;
  font-size:11pt;color:var(--gold);margin:6.5mm 0 2mm 0;
  page-break-after:avoid;text-align:left;letter-spacing:.005em;
}
h4{
  font-family:"Segoe UI",Arial,sans-serif;font-weight:600;font-size:9.6pt;
  color:var(--ink2);margin:5mm 0 1.6mm 0;page-break-after:avoid;text-align:left;
}
h1+p,h2+p,h3+p,h4+p{margin-top:0}
p{margin:0 0 3.2mm 0;orphans:2;widows:2}

/* part divider page */
.part{
  page-break-before:always;page-break-after:always;
  background:var(--deep);color:#f6f1e6;border-radius:2mm;
  margin:0;padding:66mm 20mm 18mm 20mm;height:255mm;position:relative;
}
.part .pnum{
  font-family:"Segoe UI",Arial,sans-serif;font-size:9pt;letter-spacing:.36em;
  text-transform:uppercase;color:var(--gold-l);margin-bottom:8mm;
}
.part h1{
  border:0;padding:0;margin:0 0 6mm 0;page-break-before:auto;color:#fff;font-size:34pt;
  line-height:1.06;
}
.part .pdesc{color:#a89f90;font-size:11pt;max-width:120mm;line-height:1.62}
.part .plist{
  margin-top:12mm;font-family:"Segoe UI",Arial,sans-serif;font-size:9pt;color:#8d8578;
  border-top:1px solid rgba(255,255,255,.14);padding-top:5mm;line-height:1.9;
}
.part .plist b{color:#e2d9c8;font-weight:600}

/* ---------------------------------------------------------------- text bits */
a{color:var(--gold);text-decoration:none}
strong,b{font-weight:700;color:var(--deep)}
em{font-style:italic}
code,.mono{
  font-family:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
  font-size:8.7pt;
}
p code,li code,td code,th code,dd code{
  background:var(--wash2);border:1px solid var(--rule2);border-radius:1.6mm;
  padding:.2mm 1.1mm;color:#7a4b12;
}
ul,ol{margin:0 0 3.4mm 0;padding-left:6mm}
li{margin:0 0 1.4mm 0}
ul.tight li,ol.tight li{margin:0 0 .6mm 0}
dl{margin:0 0 3.4mm 0}
dt{font-weight:700;color:var(--deep);margin-top:2.4mm}
dd{margin:.4mm 0 0 6mm;color:var(--ink2)}

.lead{font-size:11.4pt;line-height:1.6;color:var(--ink2);margin-bottom:5mm}
.lead:first-letter{}

/* ---------------------------------------------------------------- callouts */
.note,.warn,.why,.trap,.quote{
  margin:4.6mm 0;padding:3.4mm 4.4mm;border-radius:0 2mm 2mm 0;
  page-break-inside:avoid;font-size:9.6pt;line-height:1.5;
}
.note{background:var(--wash);border-left:2.6pt solid var(--rule)}
.why{background:#fbf6ea;border-left:2.6pt solid var(--gold-l)}
.warn{background:#fdf3ef;border-left:2.6pt solid #d4633a}
.trap{background:#f4f1fa;border-left:2.6pt solid #6f5fae}
.quote{background:#f3f7f4;border-left:2.6pt solid #4e8c63}
.note p:last-child,.why p:last-child,.warn p:last-child,.trap p:last-child,.quote p:last-child{margin-bottom:0}
.tag{
  display:block;font-family:"Segoe UI",Arial,sans-serif;font-size:7.4pt;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;margin-bottom:1.6mm;
}
.why .tag{color:#8a5a11}
.warn .tag{color:#a8431f}
.trap .tag{color:#4f428a}
.note .tag{color:var(--mut)}
.quote .tag{color:#33684a}

/* ---------------------------------------------------------------- code */
figure.codefig{margin:4.4mm 0;page-break-inside:auto}
figure.codefig.keep{page-break-inside:avoid}
pre.code{
  font-family:Consolas,"Cascadia Mono","DejaVu Sans Mono",monospace;
  font-size:7.9pt;line-height:1.44;
  background:var(--code-bg);color:#e3ddd2;
  margin:0;padding:3.4mm 4mm;border-radius:2mm;
  white-space:pre-wrap;word-wrap:break-word;text-align:left;
  border-left:2.6pt solid var(--gold);
}
pre.code .c{color:#7e8a7c;font-style:italic}
pre.code .s{color:#e0b878}
pre.code .k{color:#e08a6a}
pre.code .t{color:#8fc0d6}
pre.code .n{color:#c3a6e0}
pre.code .a{color:#c9b06a}
pre.code .y{color:#8fc0d6}
figcaption{
  font-family:"Segoe UI",Arial,sans-serif;font-size:8pt;color:var(--mut);
  margin-top:1.6mm;text-align:left;
}
figcaption b{color:var(--ink2)}

/* ---------------------------------------------------------------- tables */
table{
  width:100%;border-collapse:collapse;margin:4.4mm 0;font-size:9.1pt;
  page-break-inside:avoid;
}
th{
  font-family:"Segoe UI",Arial,sans-serif;font-size:8pt;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;color:var(--mut);
  text-align:left;padding:2mm 2.4mm;border-bottom:1.4pt solid var(--ink2);
  vertical-align:bottom;
}
td{padding:1.9mm 2.4mm;border-bottom:1px solid var(--rule2);vertical-align:top;text-align:left}
tbody tr:nth-child(even){background:var(--wash)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
table.small{font-size:8.4pt}
table caption{
  caption-side:bottom;font-family:"Segoe UI",Arial,sans-serif;font-size:8pt;
  color:var(--mut);text-align:left;padding-top:1.8mm;
}

/* ---------------------------------------------------------------- figures */
figure.fig{margin:5mm 0;page-break-inside:avoid;text-align:center}
figure.fig svg{max-width:100%;height:auto}
figure.fig img{max-width:100%;border-radius:2mm;border:1px solid var(--rule)}
figure.fig figcaption{text-align:center;margin-top:2.2mm}
.svgbox{background:var(--wash);border:1px solid var(--rule2);border-radius:2mm;padding:3mm}

/* ---------------------------------------------------------------- misc */
.pgmark{color:#ffffff;font-size:1px;letter-spacing:0}
.part .pgmark,.cover .pgmark{color:#171512}
.kbd{
  font-family:Consolas,monospace;font-size:8.4pt;background:var(--wash2);
  border:1px solid var(--rule);border-bottom-width:1.6pt;border-radius:1.4mm;padding:.3mm 1.4mm;
}
hr{border:0;border-top:1px solid var(--rule);margin:6mm 0}
.cols2{column-count:2;column-gap:7mm}
.cols2 p{margin-bottom:2.4mm}
.avoid{page-break-inside:avoid}
.newpage{page-break-before:always}
.chapnum{
  font-family:"Segoe UI",Arial,sans-serif;font-size:8.2pt;letter-spacing:.28em;
  text-transform:uppercase;color:var(--gold);margin-bottom:1.5mm;display:block;
}
.summary{
  background:var(--wash2);border:1px solid var(--rule);border-radius:2mm;
  padding:4mm 5mm;margin:6mm 0 0 0;page-break-inside:avoid;font-size:9.5pt;
}
.summary .tag{color:var(--gold);margin-bottom:2.2mm}
.summary ul{margin-bottom:0;padding-left:5mm}
.summary li{margin-bottom:1.2mm}
.fileref{
  font-family:"Segoe UI",Arial,sans-serif;font-size:8.2pt;color:var(--mut);
  background:var(--wash);border:1px solid var(--rule2);border-radius:1.6mm;
  padding:2mm 3mm;margin:0 0 4mm 0;
}
.fileref b{font-family:Consolas,monospace;color:var(--ink2);font-weight:400}
</style>
</head>
<body>
<!--BODY-->
</body>
</html>
