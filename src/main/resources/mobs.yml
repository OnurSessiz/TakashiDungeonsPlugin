# TakashiDungeons — mob catalogue
#
# Separate from config.yml. Reason: in PHASE 9 the GUI editor will WRITE this file, and a program
# that rewrites a file leaves no comments behind. The mob set lives in its own file so that the
# explanations in config.yml survive.
#
# After editing: /tdungeons reload
#
# ---------------------------------------------------------------------------------------------
# ADDRESSING:  mob: <provider>:<key>
#
#   vanilla:ZOMBIE            → the vanilla entity registry (always works)
#   mythicmobs:SkeletalKnight → MythicMobs (if it is not installed THIS ENTRY IS DISABLED)
#
# When a provider is missing the entry does NOT quietly fall back to vanilla; it is disabled, and
# the reason reaches both the console and /tdungeons mob list. A silent fallback produces the "why
# did the boss turn out to be an ordinary zombie" bug, and that bug comes back weeks later dressed
# as a balance complaint.
#
# The set below is entirely VANILLA — it works in full on a server with no mob plugin at all.
# ---------------------------------------------------------------------------------------------
#
# CLASS (class):  weak | normal | strong | super_strong | boss
#
# A class is NOT A MULTIPLIER, it is a POOL TAG. It answers "which pool may this be drawn from";
# the stats come from the mob's own ranges. Had the class carried a multiplier too, the
# health: [40, 50] you wrote would turn up as 120 in game with no visible reason why.
#
# The boss class is used in the boss room ONLY — a thing that can turn up in a corridor is not a
# boss.
#
# WEIGHT (weight): the share of a draw inside the same pool. The same meaning it has in the room
# templates and in loot.yml: a mob at 200 turns up twice as often as one at 100.
#
# STATS: a single number or a [min, max] range. A range is rolled again on every spawn, so that
# two zombies in the same room do not look like copies of each other. A stat you leave out keeps
# the mob's natural value.
#   health → maximum health (vanilla zombie: 20)
#   damage → attack damage (vanilla zombie: 3)
#   speed  → movement speed (vanilla zombie: 0.23) — small numbers, tread carefully
#
# statOverride: LEFT OUT, the provider decides — true for vanilla, false for MythicMobs.
#   true  → the stats above and the difficulty multiplier are applied
#   false → the mob's own plugin's stats are PRESERVED (anahedef.md §4)
#
# ---------------------------------------------------------------------------------------------
# WHAT TO KNOW ABOUT THE DUNGEON WORLD (when picking mobs)
#   - The world is Environment.NORMAL. PIGLIN and PIGLIN_BRUTE zombify here — which is why they
#     are not in the set.
#   - mobGriefing is off: a creeper explosion breaks no blocks and cannot hole through a room.
#   - The daylight cycle is off and the time is fixed at noon. The rooms are enclosed, so there is
#     no sky light and zombies/skeletons do not burn. Build a room schematic with an open ceiling
#     and that changes.
# ---------------------------------------------------------------------------------------------

# Used by dungeons that were not told which difficulty to generate at.
default-difficulty: medium

# ---------------------------------------------------------------------------------------------
# PLACING MOBS IN ROOMS
#
# HOW MANY → the room's WALKABLE COLUMN count / density. Room size is what the player sees: a
# great hall standing empty and a corridor packed shoulder to shoulder both read as a bug, and
# neither is fixed by knowing how deep the room is. Depth changes WHAT is in a room, not how many.
#
# "Walkable column" is not the area of the bounding box: the box of a cross-shaped room is mostly
# wall, and measuring by the box would put a hall's worth of mobs into each of the four arms. The
# count looks at floor reachable on foot from the room's centre — a sealed alcove behind a wall is
# not counted, and no mob is placed there either.
#
# WHICH CLASS → the room's PROPORTIONAL depth (depth / maxDepth). On an absolute threshold a
# 4-room small dungeon would stay weak from end to end; "small" means short, not harmless.
# ---------------------------------------------------------------------------------------------
spawn:
  # One mob per this many walkable blocks. Raising it thins the rooms out.
  density: 45

  # Lower and upper bound per room. The minimum applies to rooms that have a floor: a room with no
  # floor at all stays empty rather than having a mob wedged into it.
  min-per-room: 1
  max-per-room: 8

  # Whether the entrance room gets mobs. Default OFF: the player is teleported in there and should
  # not land in the middle of a fight, and it is also where the party gathers.
  entrance: false

  # THE BOSS ROOM — NONE of the rules above apply here.
  #
  # Had density and the depth band been applied to it: a large boss hall would earn 8 mobs, and
  # the deepest band would draw them from a strong/super_strong mix — a boss standing in a crowd.
  # A boss room should be precisely not that. So the count and the class are written out ONE BY
  # ONE here.
  #
  # The boss is placed on the standable column nearest the room's CENTRE (the flood fill's seed).
  # It is facing the player as they come through the door, not tucked behind a pillar in a corner.
  #
  # If the boss pool is empty the room is left EMPTY and the reason reaches the console — it does
  # not draw from super_strong instead. A silent substitution is the kind of bug an operator finds
  # out about weeks later, as "the last room is no different from the one before it".
  boss:
    # Turn this off and the boss room stays empty. It is NOT handed to the ordinary room spawner.
    enabled: true

    # How many guards stand with the boss. Deliberately small: they are there to make the room
    # look guarded, not to be the fight itself.
    guards: 2

    # Which pool the guards are drawn from. Not taken from the depth band: the deepest band is a
    # MIX, and two weak zombies turning up in the boss room reads as a spawner leak.
    guard-class: strong

  # Depth bands. until = the upper bound of depth/maxDepth (inclusive); classes = the share each
  # class is drawn at within that band. Weight means what it means everywhere else: 70/30 is
  # 70 against 30.
  bands:
    - until: 0.25
      classes: { weak: 70, normal: 30 }
    - until: 0.55
      classes: { weak: 25, normal: 60, strong: 15 }
    - until: 0.80
      classes: { normal: 45, strong: 45, super_strong: 10 }
    - until: 1.00
      classes: { normal: 20, strong: 55, super_strong: 25 }

# Difficulty multipliers. Unlike a class these REALLY ARE multipliers — but there are three of
# them, because if speed scaled with health the dungeon would turn into a footrace: at 2.2× speed
# nothing can be fled from, nothing can be kited, and a fight stops being a fight. Health takes
# the big multiplier, damage a middling one, speed almost none.
#
# Armour is the VISIBLE half of difficulty: a mob in diamond armour reads as dangerous from across
# the room. The damage reduction is a side effect; legibility is the point.
#
# The difficulty multiplier obeys statOverride too — applying a multiplier to somebody else's boss
# is overriding it just the same.
difficulty:
  easy:
    health: 1.0
    damage: 1.0
    speed: 1.0
    armor: none
  medium:
    health: 1.5
    damage: 1.25
    speed: 1.05
    armor: leather
    # Not everyone gets armour: at 35% armour reads as "danger", at 100% it reads as a uniform.
    armor-chance: 0.35
  hard:
    health: 2.2
    damage: 1.6
    speed: 1.1
    armor: iron
    armor-chance: 0.6

mobs:

  # ----------------------------------------------------------------------------- weak
  # Entrance rooms and shallow depth. They are not there to take the player's measure, they are
  # there to show that the dungeon is alive.

  crypt_zombie:
    mob: vanilla:ZOMBIE
    class: weak
    weight: 150
    health: [16, 22]
    damage: [2, 3]

  crypt_skeleton:
    mob: vanilla:SKELETON
    class: weak
    weight: 120
    health: [16, 20]
    damage: [2, 3]

  cave_spider_scout:
    mob: vanilla:CAVE_SPIDER
    class: weak
    weight: 80
    health: [12, 16]
    damage: [2, 2]
    # Spiders are fast already; we leave speed alone.

  # ----------------------------------------------------------------------------- normal
  # The body of the dungeon. The player is expected to spend most of their time on these.

  husk_raider:
    mob: vanilla:HUSK
    class: normal
    weight: 130
    health: [24, 32]
    damage: [4, 5]

  stray_archer:
    mob: vanilla:STRAY
    class: normal
    weight: 110
    health: [22, 28]
    damage: [3, 4]

  drowned_guard:
    mob: vanilla:DROWNED
    class: normal
    weight: 90
    health: [26, 34]
    damage: [4, 6]

  witch_acolyte:
    mob: vanilla:WITCH
    class: normal
    weight: 60
    health: [26, 30]

  spider_broodling:
    mob: vanilla:SPIDER
    class: normal
    weight: 80
    health: [20, 26]
    damage: [3, 4]

  # ----------------------------------------------------------------------------- strong
  # Deep rooms and the ends of side branches. One of these alone should give the player trouble.

  wither_skeleton_guard:
    mob: vanilla:WITHER_SKELETON
    class: strong
    weight: 100
    health: [40, 50]
    damage: [6, 8]
    name: "<gray>Ash Warden</gray>"

  vindicator_enforcer:
    mob: vanilla:VINDICATOR
    class: strong
    weight: 90
    health: [38, 46]
    damage: [7, 9]
    name: "<gray>Axemaster</gray>"

  blaze_sentry:
    mob: vanilla:BLAZE
    class: strong
    weight: 55
    health: [30, 36]
    name: "<gold>Flame Sentry</gold>"

  enderman_stalker:
    mob: vanilla:ENDERMAN
    class: strong
    weight: 45
    health: [45, 55]
    damage: [6, 8]

  # ----------------------------------------------------------------------------- super_strong
  # Rare. More than one of these in a single room is a bug, not a difficulty setting — the depth
  # bands above decide the spread.

  evoker_warlock:
    mob: vanilla:EVOKER
    class: super_strong
    weight: 70
    health: [70, 85]
    name: "<dark_purple>Warlock</dark_purple>"

  ravager_bull:
    mob: vanilla:RAVAGER
    class: super_strong
    weight: 60
    health: [90, 110]
    damage: [9, 12]
    speed: 0.28
    name: "<red>Destroyer</red>"

  # ----------------------------------------------------------------------------- boss
  # The boss room only. The numbers are high on purpose: the boss room is the end of the dungeon,
  # and the boss is the wall that has to be got past.

  bone_lord:
    mob: vanilla:WITHER_SKELETON
    class: boss
    weight: 100
    health: [220, 260]
    damage: [12, 15]
    speed: 0.26
    name: "<dark_red><bold>Bone Lord</bold></dark_red>"

  ravager_warlord:
    mob: vanilla:RAVAGER
    class: boss
    weight: 90
    health: [280, 340]
    damage: [14, 18]
    speed: 0.3
    name: "<dark_red><bold>War Destroyer</bold></dark_red>"

  arch_evoker:
    mob: vanilla:EVOKER
    class: boss
    weight: 70
    health: [200, 240]
    name: "<dark_red><bold>Arch Evoker</bold></dark_red>"

  # ----------------------------------------------------------------------------- example: MythicMobs
  # If MythicMobs is not installed this entry is disabled and the reason is logged — the set is
  # not broken by it.
  # statOverride is left out, so MythicMobs' own stats are PRESERVED.
  #
  # mythic_knight:
  #   mob: mythicmobs:SkeletalKnight
  #   class: strong
  #   weight: 100
