# TakashiDungeons — main configuration
# Rule: everything works through YAML first; GUI editors come later.

dungeon-world:
  # Name of the void world the instances live in. Keep it unique so it cannot
  # collide with another world on the server.
  name: takashi_dungeons

  # Edge length, in blocks, of the square reserved for one instance. It must be
  # larger than the area the biggest possible dungeon covers; set it too small
  # and two instances bleed into each other's blocks.
  slot-size: 512

  # How many slots wide the grid is. slot-size * columns = the world's extent
  # along X; 512 * 32 = 16,384 blocks, far inside the world border.
  columns: 32

  # The base height rooms are seated at.
  base-y: 64

  # Wipe the world's chunk files every time the server starts.
  #
  # This world holds NOTHING but dungeon instances, and no instance survives a shutdown — they
  # live in memory only. So every block left on disk is the debris of a dungeon that is already
  # gone. Without the wipe the slot counter restarts at 0 while the old blocks stay put, and the
  # next dungeon is pasted straight on top of the previous one.
  #
  # Turn it off only if you deliberately build something permanent in this world — and know that
  # dead instances then accumulate on disk. level.dat is never touched; the world's own settings
  # and spawn point survive either way.
  reset-on-start: true

schematics:
  # Jar ile gelen odaları ilk açılışta (ve sonraki açılışlarda eksik olanları)
  # plugins/TakashiDungeons/schematics/ altına çıkarır. Kapatırsan temiz bir kurulumda
  # SIFIR oda olur ve generation hiçbir şey üretemez — sadece kendi oda setini elle
  # yöneten sunucular kapatmalı. Var olan dosyanın üzerine ASLA yazılmaz; elle yeniden
  # yazdırmak için /tdungeons extract force.
  extract-bundled: true

  # true: paste on the main thread even when FAWE is installed.
  # Only turn this on while diagnosing a FAWE-related problem — with it enabled,
  # generating a large dungeon costs TPS.
  force-sync-paste: false

generation:
  # Turn bias — generation.md 6.4. Keeps the chain from running as if drawn with a
  # ruler: door options that continue in the parent's direction get pushed back.
  #
  # 1.0 = no penalty (rooms may line up straight)
  # 2.0 = a straight option still jumps ahead 50% of the time (default)
  # higher = turns dominate more
  #
  # The penalty is applied when choosing a DOOR, not when choosing a template —
  # otherwise the meaning of 'weight' would be corrupted (see generation.md 5.4).
  turn-bias: 2.0

  # If the critical path cannot reach its target length, generation restarts with a
  # different seed. Retrying rather than silently accepting a short dungeon is what
  # keeps the promise made to the player: if they chose "medium", they get medium.
  # When the attempts run out the BEST attempt is used and the result is reported
  # with a warning — a small dungeon is never handed over silently.
  max-attempts: 8

  # Whether doors opening into the void get sealed (generation.md 7 — plugging).
  # Left unsealed, a player walks out of a room and falls into the void. Only turn
  # this off while debugging: with it off you can see where the graph choked.
  plug-open-doors: true

instance:
  # Bir dungeon ne kadar ayakta kalır. Süre dolunca içerideki herkes girdiği yere ışınlanır
  # ve dungeon silinir — bloklar dahil.
  # TEST DEĞERİ — yayın öncesi 1800'e geri alınacak.
  duration-seconds: 300

  # İçinde kimse kalmayınca kaç saniye sonra kapansın. 0 = kapanmasın, süresini doldursun.
  #
  # Sayaç ancak dungeon'a BİR KEZ girildikten sonra işlemeye başlar: operatörün üretip
  # bakmakta olduğu, hiç girilmemiş bir dungeon bu yüzden ayağının altından silinmez.
  # TEST DEĞERİ — yayın öncesi 300'e geri alınacak.
  empty-timeout-seconds: 60

  # Kalan süre uyarıları, saniye cinsinden. Her eşik bir kez duyurulur ve sadece içeride
  # oyuncu varken. Boş bırakılırsa uyarı çıkmaz.
  # TEST DEĞERİ — 5 dakikalık süreye göre. Yayın öncesi [300, 60, 10]'a geri alınacak.
  warn-seconds: [120, 60, 10]

  boss-bar:
    # Ekranın üstünde kalan süreyi gösteren çubuk. Kapatılırsa süre sistemi aynen çalışır,
    # sadece görünmez olur.
    enabled: true

    # MiniMessage. Yerine geçenler: <time> <theme> <size> <rooms> — hepsi unparsed.
    # Çubuk dolmuyor, BOŞALIYOR; rengi kalan orana göre kendisi değişiyor:
    # mavi -> %25 altında sarı -> %10 altında kırmızı.
    title: "<gold>Dungeon</gold> <dark_gray>|</dark_gray> <white><time></white>"

portal:
  # ---------------------------------------------------------------------------------------
  # GEÇİCİ GÖRÜNÜM. Ametist blok + üstünde dönen bir ametist shard + "Dungeon" yazısı.
  # Kalıcı görsel geldiğinde burası değişir, kod değişmez.
  #
  # Yazı ve shard birer Display entity: hitbox'ları, ağırlıkları, çarpışmaları yok. Tam da bu
  # yüzden görselin üstüne ayrı bir Interaction hitbox konuyor — oyuncu havadaki shard'a nişan
  # alıyor ve tıklanamayan bir şeye tıklamak bozuk geçit gibi görünürdü.
  # ---------------------------------------------------------------------------------------
  block: AMETHYST_BLOCK
  item: AMETHYST_SHARD
  label: "<light_purple><bold>Dungeon</bold></light_purple>"

  # Sağ tıkta açılacak dungeon'ın boyutu.
  size: medium

  # Hangi temadan üretilecek. Boş bırakılırsa: tek tema varsa o kullanılır, birden fazlaysa
  # geçit açılmaz ve sebebini söyler — sessizce yanlış havuzdan çekmek "neden crypt odaları
  # geldi" hatası üretir.
  theme: ""

  lobby:
    # Kullanılmış bir lobby geçidi günün hangi saatlerinde yenilenir. Süre değil SAAT:
    # lobby ortak bir yer, "zindanlar 12'de ve gece yarısı yenilenir" duyurulabilir ve
    # oyuncu buna göre plan yapar. Kayan bir sayaçta her geçit başka bir anda dönerdi.
    # Liste boş bırakılırsa dungeon biter bitmez yenilenir.
    refresh-hours: [0, 12]

    # Açılışta kurulacak sabit geçitler. Geçitler restart'ı atlatmıyor (kalıcılık FAZ 7'de),
    # bu yüzden lobby geçidinin kalıcı adresi burası.
    #   - world: world
    #     x: 100
    #     y: 64
    #     z: 100
    #     size: medium      # opsiyonel
    #     theme: default    # opsiyonel
    points: []

  wild:
    # Doğada kendiliğinden doğan geçitler. Bunlar tek kullanımlık: bağlı oldukları dungeon
    # bitince geçit de silinir. Bulunacak bir şeyin aynı yerde yeniden doğması onu
    # bulunacak bir şey olmaktan çıkarır.
    enabled: true

    # Boş bırakılırsa her dünyada doğabilir.
    worlds: [world]

    # Kaç dakikada bir doğma denemesi yapılır. En az 1 dakikaya sıkıştırılır.
    interval-minutes: 10

    # Aynı anda doğada en fazla kaç geçit durabilir.
    max: 3

    # Geçit rastgele bir ONLINE oyuncunun etrafında doğar, spawn'ın etrafında değil: kimsenin
    # olmadığı yerde beliren dungeon kimsenin bulmadığı dungeon'dır. Kimse online değilse
    # hiçbir şey doğmaz.
    min-distance: 64
    max-distance: 256

    # İki geçit arasındaki en az mesafe.
    spacing: 128

hud:
  # Sağ taraftaki sidebar HUD'u. false ise hiçbir oyuncuya gösterilmez ve /hud da çalışmaz.
  enabled: true

  # Oyuncu sunucuya girdiğinde HUD açık mı gelsin. Her oyuncu kendi tarafında /hud ile
  # kapatabilir; bu tercih şimdilik oturum boyunca hatırlanır (kalıcı olması SQL katmanını,
  # yani FAZ 7'yi bekliyor — player data YAML'a yazılmaz).
  show-by-default: true

  # Kaç tick'te bir tazelenir. 20 tick = 1 saniye. Bugün satırların hepsi sabit; coin ve XP
  # gerçek değer döndürmeye başladığında bu değer önem kazanacak. Çok düşürmenin anlamı yok.
  refresh-ticks: 20

  # Bu ikisi operatör komutuyla da değiştirilebilir ve buraya geri yazılır:
  #   /tdungeons hud name <metin>
  #   /tdungeons hud ip <metin>
  # Düz metin yazılırsa başlık altın sarısı + kalın çıkar; MiniMessage etiketi yazılırsa
  # kendi rengini korur.
  server-name: "<gradient:#ffd45e:#ff8a3d>TAKASHI</gradient>"
  server-ip: "play.sunucun.net"

  # Satır düzeni — yukarıdan aşağı. MiniMessage biçimi.
  # Yerine geçenler: <player> <coin> <xp> <rank> <server> <ip>
  # Scoreboard en fazla 16 satır taşır; fazlası atılır. Satırları kısa tut, sidebar
  # genişliği en uzun satıra göre belirlenir ve ekranın sağını gereksiz kaplar.
  lines:
    - "<dark_gray><strikethrough>                    "
    - "<gray>Oyuncu <white><player>"
    - "<gray>Coin <gold><coin>"
    - "<gray>Rank <aqua><rank> <dark_gray>| <gray>XP <white><xp>"
    - "<dark_gray><strikethrough>                    "
    - "<yellow><ip>"
