# TakashiDungeons — main configuration
# Rule: everything works through YAML first; GUI editors come later.
#
# THIS FILE HOLDS BEHAVIOUR, NOT WORDS. Every message a player reads lives in lang/<code>.yml.
# The split is deliberate: a translator who has to hunt through two files for the other half of
# the sentences translates one of them and ships a plugin that is half in their language.

# Which lang/<code>.yml is used. Shipped: en, tr.
#
# To add your own: copy lang/en.yml to lang/xx.yml, translate the values, put xx here, then
# /tdungeons reload. A key your file is missing falls back to the English text bundled inside
# the jar and logs one line naming it — players never see a raw key.
language: en

# Where player data is kept: HUD settings and the dungeon counters behind /tdungeons stats.
#
# Player data is NEVER written to a YAML file — not here, not anywhere. A flat file cannot be
# written safely from two threads, cannot be shared between servers, and grows a file per player
# until the folder is unusable. This block is the only thing that decides where it goes.
#
# The plugin runs WITHOUT a working database: it says so once in the log, and settings and counters
# then last only until the player logs out. Nothing else changes — generation, mobs, loot, parties
# and the shop never touch this layer.
storage:
  # sqlite (default) or mysql.
  #
  # sqlite is a file in this folder and needs nothing installed; it is the right answer for a
  # single server. mysql is for a network: point several servers at one database and a player's
  # HUD setting and counters follow them between them. Anything else here is refused by name —
  # a typo is never quietly turned into sqlite, because you would find out from the wrong data
  # months later.
  type: sqlite

  sqlite:
    # Relative to plugins/TakashiDungeons/.
    file: data.db

  mysql:
    host: localhost
    port: 3306
    database: takashi_dungeons
    username: root
    password: ""
    # Appended to the JDBC URL after a '?'. Leave empty unless your server needs something
    # specific, e.g. "useSSL=false&characterEncoding=utf8".
    properties: ""

  # How often the counters are written, in seconds. Settings (the /hud switches) are NOT batched —
  # they are written the moment they change. The counters are, because a party clearing a dungeon
  # produces hundreds of kills and a row per kill would be a write storm for numbers nobody is
  # reading mid-fight. A crash costs at most this many seconds of counting; it never costs a
  # setting. Values below 5 are raised to 5.
  flush-seconds: 60

dungeon-world:
  # Name of the void world the instances live in. Keep it unique so it cannot
  # collide with another world on the server.
  name: takashi_dungeons

  # Edge length, in blocks, of the square reserved for one instance. It must be
  # larger than the area the biggest possible dungeon covers; set it too small
  # and two instances bleed into each other's blocks.
  slot-size: 512

  # How many slots wide the grid is. slot-size * columns = the world's extent
  # along X; 512 * 32 = 16,384 blocks, far inside the world border.
  columns: 32

  # The base height rooms are seated at.
  base-y: 64

  # Wipe the world's chunk files every time the server starts.
  #
  # This world holds NOTHING but dungeon instances, and no instance survives a shutdown — they
  # live in memory only. So every block left on disk is the debris of a dungeon that is already
  # gone. Without the wipe the slot counter restarts at 0 while the old blocks stay put, and the
  # next dungeon is pasted straight on top of the previous one.
  #
  # Turn it off only if you deliberately build something permanent in this world — and know that
  # dead instances then accumulate on disk. level.dat is never touched; the world's own settings
  # and spawn point survive either way.
  reset-on-start: true

schematics:
  # Unpack the rooms shipped inside the jar into plugins/TakashiDungeons/schematics/ on first
  # start — and on later starts, any of them that have gone missing. Turn it off and a clean
  # install has ZERO rooms, so generation can produce nothing; only servers that manage their
  # own room set by hand should do that. An existing file is NEVER overwritten; to force the
  # bundled copies back onto disk, use /tdungeons extract force.
  extract-bundled: true

  # true: paste on the main thread even when FAWE is installed.
  # Only turn this on while diagnosing a FAWE-related problem — with it enabled,
  # generating a large dungeon costs TPS.
  force-sync-paste: false

generation:
  # Turn bias — generation.md 6.4. Keeps the chain from running as if drawn with a
  # ruler: door options that continue in the parent's direction get pushed back.
  #
  # 1.0 = no penalty (rooms may line up straight)
  # 2.0 = a straight option still jumps ahead 50% of the time (default)
  # higher = turns dominate more
  #
  # The penalty is applied when choosing a DOOR, not when choosing a template —
  # otherwise the meaning of 'weight' would be corrupted (see generation.md 5.4).
  turn-bias: 2.0

  # If the critical path cannot reach its target length, generation restarts with a
  # different seed. Retrying rather than silently accepting a short dungeon is what
  # keeps the promise made to the player: if they chose "medium", they get medium.
  # When the attempts run out the BEST attempt is used and the result is reported
  # with a warning — a small dungeon is never handed over silently.
  max-attempts: 8

  # Whether doors opening into the void get sealed (generation.md 7 — plugging).
  # Left unsealed, a player walks out of a room and falls into the void. Only turn
  # this off while debugging: with it off you can see where the graph choked.
  plug-open-doors: true

instance:
  # How long a dungeon stays up. When the clock runs out everyone inside is teleported back to
  # where they entered from and the dungeon is deleted, blocks included.
  # TEST VALUE — put back to 1800 before release.
  duration-seconds: 300

  # How many seconds after the last player leaves the dungeon closes. 0 = never; let it run its
  # full duration instead.
  #
  # The countdown only starts once the dungeon has been entered AT LEAST ONCE, so a dungeon an
  # operator generated and is standing in to inspect is not deleted out from under them.
  # TEST VALUE — put back to 300 before release.
  empty-timeout-seconds: 60

  # Time-remaining warnings, in seconds. Each threshold is announced once, and only while there
  # are players inside. Leave the list empty for no warnings.
  # TEST VALUE — sized for the 5-minute duration. Put back to [300, 60, 10] before release.
  warn-seconds: [120, 60, 10]

  # How many seconds the dungeon stays up after the boss is killed.
  #
  # This is a CEILING, not a refill: a dungeon with 40 seconds left does NOT jump back up to 60
  # when the boss dies. A timer you can extend is not a timer.
  #
  # Write 0 and the time is never shortened — the dungeon is merely marked "cleared". The reason
  # for shortening it at all: leave the full duration and killing the boss changes nothing, so it
  # is not an ending; close instantly and the party is thrown out of the room the moment they win,
  # unable to pick up what the fight dropped (PHASE 4 puts loot in that room).
  clear-grace-seconds: 60

  boss-bar:
    # The bar across the top of the screen showing the time left. Turn it off and the timer system
    # works exactly the same, it just becomes invisible.
    #
    # The bar's TEXT is not here: lang/<code>.yml -> instance.boss-bar (and, once the boss is
    # dead, instance.boss-bar-cleared). Every word a player reads lives there.
    enabled: true

portal:
  # ---------------------------------------------------------------------------------------
  # PLACEHOLDER LOOK. An amethyst block, an amethyst shard spinning above it, and the word
  # "Dungeon". When the final art arrives this is what changes — the code does not.
  #
  # The text and the shard are Display entities: no hitbox, no weight, no collision. That is
  # exactly why a separate Interaction hitbox is placed over the whole thing — players aim at
  # the shard floating in the air, and clicking something unclickable reads as a broken gateway.
  # ---------------------------------------------------------------------------------------
  # The gateway's TEXT is not here: lang/<code>.yml -> portal.label
  block: AMETHYST_BLOCK
  item: AMETHYST_SHARD

  # Size of the dungeon a right-click opens.
  size: medium

  # Which theme it is generated from. Left empty: if there is exactly one theme it is used; if
  # there are several the gateway does not open and says why — silently drawing from the wrong
  # pool produces the "why did I get crypt rooms" bug.
  theme: ""

  lobby:
    # At which hours of the day a used lobby gateway comes back. These are HOURS, not a duration:
    # a lobby is a shared place, "the dungeons refresh at noon and midnight" can be announced, and
    # players plan around it. On a sliding countdown every gateway would come back at its own
    # private moment. Leave the list empty and it refreshes as soon as its dungeon ends.
    refresh-hours: [0, 12]

    # Fixed gateways created at startup. Gateways deliberately do NOT go into the database: what
    # gives one meaning is the instance behind it, no instance survives a restart, and a gateway
    # restored without one would be a door onto nothing. This list is the lobby's permanent address
    # instead — text an operator can read and edit.
    #   - world: world
    #     x: 100
    #     y: 64
    #     z: 100
    #     size: medium      # optional
    #     theme: default    # optional
    points: []

  wild:
    # Gateways that appear out in the world on their own. These are single-use: when the dungeon
    # behind one ends, the gateway is deleted too. Something that respawns in the same spot stops
    # being something you find.
    enabled: true

    # Leave empty to allow every world.
    worlds: [world]

    # How many minutes between spawn attempts. Clamped to at least 1 minute.
    interval-minutes: 10

    # How many wild gateways may stand at the same time.
    max: 3

    # A gateway spawns around a random ONLINE player, not around spawn: a dungeon that appears
    # where nobody is, is a dungeon nobody finds. With nobody online, nothing spawns.
    min-distance: 64
    max-distance: 256

    # Minimum distance between two gateways.
    spacing: 128

party:
  # Whether players can form parties at all. false makes /party answer with one line and nothing
  # else — no invites, no shared entry, no party block in the sidebar.
  enabled: true

  # How many players one party may hold, the leader included.
  #
  # Counted against the invites in flight as well as the members present, so a four-slot party
  # cannot send four invites and end up with seven people. Values below 2 are raised to 2: a
  # party of one is what a player already has by standing there.
  max-size: 4

  # How long an invite stays clickable. When it runs out BOTH sides are told — the target has a
  # button in their chat that has quietly stopped working, and the inviter is waiting for an
  # answer that is never coming. Values below 5 are raised to 5.
  invite-timeout-seconds: 60

  # Whether kicking a player out of the party also throws them out of the party's dungeon.
  #
  # OFF by default, and only for a kick — never for leaving. Leaving a party is a social act and
  # must not cost a player the run they are halfway through; a leader clearing out somebody who is
  # ruining the run is the one case where an operator might want the two joined.
  kick-removes-from-dungeon: false

  # Whether the party block inside the sidebar is on when a player joins. Each player flips their
  # own with /party hud, and that choice is saved (see the storage block at the top of this file).
  #
  # This value is the default for players who have NEVER used /party hud. Changing it moves them
  # and nobody else: a player who has made a choice keeps it.
  #
  # WHERE the block sits is not here: lang/<code>.yml -> hud.lines carries a "<party>" line and
  # the block replaces it. No such line, no block. The block's own lines are hud.party-* there.
  hud-by-default: true

  # NOTE — a party lives in memory and a disconnect removes the player from it. Keeping the seat
  # warm for a reconnect needs a timeout clock and a rule for what the dungeon does with a member
  # who is not there; the storage layer it would have been written to now exists, the rule does not.
  # Until it does, a disconnect is a departure.

hud:
  # The sidebar HUD on the right. false hides it from every player and disables /hud as well.
  enabled: true

  # Whether the HUD is on when a player joins. Each player can turn it off for themselves with
  # /hud, and that choice is saved (see the storage block at the top of this file).
  #
  # This value is the default for players who have NEVER used /hud. Changing it moves them and
  # nobody else — a saved "off" is not overwritten by an operator turning the default back on.
  show-by-default: true

  # How many ticks between refreshes. 20 ticks = 1 second. Today every line is static; this value
  # will start to matter once coin and XP return real numbers. There is no point lowering it much.
  refresh-ticks: 20

  # These two can also be changed by operator command, which writes them back here:
  #   /tdungeons hud name <text>
  #   /tdungeons hud ip <text>
  # Plain text is rendered gold and bold; a MiniMessage tag keeps its own colours.
  server-name: "<gradient:#ffd45e:#ff8a3d>TAKASHI</gradient>"
  server-ip: "play.example.net"

  # The LINE LAYOUT is not here: lang/<code>.yml -> hud.lines
  #
  # Reason: the words in the layout — Player, Coin, Rank — are exactly the words that need
  # translating. The values it shows (server-name and server-ip above) stay here.
