# TakashiDungeons — ana konfigürasyon
# Kural (anahedef.md): her şey önce YAML ile çalışır, GUI editör sonra gelir.

dungeon-world:
  # Instance'ların yaşadığı void dünyanın adı. Sunucudaki başka bir dünyayla
  # çakışmasın diye benzersiz tutun.
  name: takashi_dungeons

  # Bir instance'a ayrılan karenin kenarı (blok). Üretilebilecek en büyük
  # dungeon'ın kapladığı alandan büyük olmalı; küçük seçilirse iki instance
  # birbirinin bloklarına taşar.
  slot-size: 512

  # Grid'in kaç slot genişliğinde olduğu. slot-size * columns = dünyanın X ekseni
  # boyunca uzunluğu; 512 * 32 = 16.384 blok (dünya sınırının çok altında).
  columns: 32

  # Odaların oturacağı taban yüksekliği.
  base-y: 64

schematics:
  # true: FAWE kurulu olsa bile paste main thread'de yapılır.
  # Sadece FAWE ile ilgili bir sorun teşhis edilirken açılmalı — açıkken büyük
  # dungeon üretimi TPS düşürür.
  force-sync-paste: false

generation:
  # Dönüş yanlılığı — generation.md 6.4. Zincirin cetvelle çizilmiş gibi düz gitmesini
  # engeller: "ebeveynle aynı yöne devam eden" kapı seçenekleri geriye itilir.
  #
  # 1.0 = ceza yok (odalar düz dizilebilir)
  # 2.0 = düz devam eden seçenek %50 ihtimalle yine de öne geçer (varsayılan)
  # yüksek = dönüşler daha baskın
  #
  # Ceza KAPI seçimi aşamasında uygulanır, şablon seçimi aşamasında değil — yoksa
  # 'agirlik' değerinin anlamı bozulurdu (bkz. generation.md 5.4).
  turn-bias: 2.0

  # Kritik path hedef uzunluga ulasamazsa uretim bastan denenir (farkli tohumla).
  # Kisa dungeon'i sessizce kabul etmek yerine yeniden denemek kullaniciya verilen
  # sozun geregi: "medium" secildiyse medium gelmeli. Denemeler tukenirse EN IYI
  # deneme kullanilir ve sonuc uyariyla raporlanir -- sessizce kucuk dungeon verilmez.
  max-attempts: 8

  # Bosluga acilan kapilar kapatilsin mi (generation.md 7 -- tipa).
  # Kapatilmazsa oyuncu odadan void'e duser. Sadece hata ayiklarken kapatin:
  # kapali oldugunda grafin nerede tikandigi gozle gorulur.
  plug-open-doors: true
