# Not a measuring mistake - it has been verified.
#
# origin (the block under your feet at //copy time):  210, 81, 224
#   door 0:  210, 80, 235  ->  [  0, -1,  11]   south
#   door 1:  199, 80, 224  ->  [-11, -1,   0]   west
#   door 2:  210, 80, 213  ->  [  0, -1, -11]   north
#   door 3:  221, 80, 224  ->  [ 11, -1,   0]   east
#
# Box (relative to origin): X -11..11  Y -2..6  Z -11..11

type: entrance
weight: 100

doors:
  - [0, -1, 11]
  - [-11, -1, 0]
  - [0, -1, -11]
  - [11, -1, 0]
