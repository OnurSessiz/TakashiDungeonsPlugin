name: TakashiDungeons
version: ${project.version}
main: com.takashi.dungeons.TakashiDungeonsPlugin
api-version: '1.21'
author: Onur Sessiz
description: Prosedürel dungeon sistemi

# Hiçbiri kurulu olmasa da plugin enable olur (bkz. anahedef.md — hard depend YASAK)
softdepend:
  - WorldEdit
  - FastAsyncWorldEdit
  - MythicMobs
  - Vault

commands:
  tdungeons:
    description: TakashiDungeons yönetim komutu
    usage: /tdungeons <version|status|world|list|rooms|room|weights|gen|paste|connect|dungeon|slots|free>
    aliases: [td, takashidungeons]
    permission: takashidungeons.admin

permissions:
  takashidungeons.admin:
    description: TakashiDungeons yönetim komutlarına erişim
    default: op
