name: TakashiDungeons
version: ${project.version}
main: com.takashi.dungeons.TakashiDungeonsPlugin
api-version: '1.21'
author: Onur Sessiz
description: Procedural dungeon system

# The plugin enables even with none of these installed — a hard dependency is forbidden.
softdepend:
  - WorldEdit
  - FastAsyncWorldEdit
  - MythicMobs
  - Vault

commands:
  tdungeons:
    description: TakashiDungeons administration command
    usage: /tdungeons <version|status|world|list|rooms|room|weights|gen|paste|connect|dungeon|instances|enter|leave|close|portal|mob|loot|shop|parties|db|stats|api|slots|free|hud>
    aliases: [td, takashidungeons]
    permission: takashidungeons.admin
  hud:
    description: Toggle the sidebar HUD for yourself
    usage: /hud [on|off]
    aliases: [tdhud, dhud]
    permission: takashidungeons.hud
  party:
    description: Create and manage a party
    usage: /party <invite|accept|deny|leave|kick|leader|disband|list>
    # /p is the alias players expect. It is NOT taken here if another plugin already owns it —
    # Bukkit hands the loser of an alias clash a namespaced /takashidungeons:party instead.
    aliases: [p, tdparty]
    permission: takashidungeons.party

permissions:
  takashidungeons.admin:
    description: Access to the TakashiDungeons administration commands
    default: op
  takashidungeons.hud:
    description: Ability to toggle your own sidebar HUD
    default: true
  takashidungeons.party:
    description: Ability to form and manage a party
    default: true
  # The admin exception to "no /tp or /tpa inside a dungeon" (anahedef.md 5). Without it the
  # rule would lock staff out of the very instances they need to reach in order to moderate.
  takashidungeons.teleport.bypass:
    description: Teleport into and out of dungeons freely
    default: op
