# TakashiDungeons - loot catalogue
#
# Separate from config.yml, exactly like mobs.yml, and for the same reason: phase 9's GUI editor
# will WRITE this file, and a program that rewrites a file destroys the comments in it. Every
# explanation below survives because loot lives in its own file.
#
# After editing:  /tdungeons loot reload   (or /tdungeons reload for everything)
#
# ===============================================================================================
# CLASS (class):  common | uncommon | rare | ultra_rare | legendary | mythic
#
# A class is a POOL TAG, not a multiplier - the same rule mobs.yml states. It answers "which pool
# may a draw take this from"; what the item actually is comes from its own entry below.
#
# MYTHIC is rarer than legendary and nothing else about it is special: no hiding, no announcement,
# no separate code path. It is rare because its weight is small. The base split below leaves it at
# ZERO and only boss_chest declares a weight for it, so a mythic is something you get for killing a
# boss and never something a room chest hands you. Change that by writing a weight - it is a number
# here, not a rule in the code.
#
# WEIGHT (weight): the share inside that pool. Same meaning everywhere in this plugin: an item at
# 200 turns up twice as often as one at 100. Only compared against others in the SAME class.
#
# Two weights, two questions, and they are not the same question:
#   rarity: below decides WHICH CLASS a draw lands on
#   weight: on an item decides WHICH ITEM within that class
#
# ===============================================================================================
# RARITY - the class split of a single draw
#
# 1000-based rather than percentages so that adding a class or nudging one share does not force
# every other number to be retyped. These are the defaults every table uses unless it writes its
# own 'rarity:' block.
#
# THE TOP END IS DELIBERATELY THIN, and it is worth knowing why before raising it. A medium
# dungeon holds around a dozen chests, so a draw's share is multiplied by roughly 36. At 4%
# ultra_rare - which is what shipped first - that is two and a half enchanted diamond swords PER
# RUN, and a dungeon meant to be run again turns the tier into standard equipment within an
# evening. Halved to 2%, a run yields about one, which is what "ultra rare" has to mean for the
# word to survive contact with a repeatable instance. Legendary went the same way, 1% -> 0.5%,
# putting it at roughly one run in three.
#
# The dungeon's texture is meant to come from RARE - diamonds, named iron gear, a golden apple -
# which is still nearly six items a run. Raise ultra_rare and legendary only if your dungeons are
# long or hard to reach.
rarity:
  common: 625        # 62.5%
  uncommon: 265      # 26.5%
  rare: 85           # 8.5%
  ultra_rare: 20     # 2%
  legendary: 5       # 0.5%
  mythic: 0          # boss_chest only - see the note above the class list

# ===============================================================================================
# DIFFICULTY - and the one thing about it that is not obvious
#
# Multiplying EVERY class by the difficulty multiplier changes nothing at all: a draw normalises,
# so 2.5x across the board is the same distribution it started with.
#
# So the multiplier is applied to RARE AND ABOVE ONLY, and the weight it adds is taken back out of
# common. Uncommon is left alone and the total stays at 1000, so the shares still read against the
# same denominator. At hard (2.5x):
#
#     rare        85 -> 213        uncommon  265 (untouched)
#     ultra       20 ->  50        common    625 - 166 = 459
#     legendary    5 ->  13
#                                  legendary 0.5% -> 1.3%,  common 62.5% -> 45.9%
#
# Common is the only source, and it can run out: a table written with no common weight has nothing
# to move, so it is the same at every difficulty. That is allowed - a flat boss reward is a design
# choice - and the console says which tables it applies to at startup, so nobody finds out by
# comparing two runs.
difficulty:
  easy: 1.0
  medium: 1.75
  hard: 2.5

# ===============================================================================================
# TABLES - a named "roll some loot": how many draws, and how those draws lean
#
# One concept, several consumers. A room chest and a boss reward differ in how many draws they get
# and how rare they lean, not in how a draw works, so both reference a table by name.
#
#   rolls   how many draws. A single number or a [min, max] range.
#   rarity  optional - overrides the split above for this table only.
#
# A draw that lands on a class with no items in it produces NOTHING. It does not slide down to a
# class that does have items: that would turn the 1% legendary roll a player just earned into a
# loaf of bread, silently. The console warns at startup when a table draws a class the catalogue
# cannot fill.
tables:

  # Ordinary rooms. Deliberately modest - the dungeon's income, not its reward.
  room_chest:
    rolls: [2, 4]

  # What a mob leaves on the floor. ONE draw, because it is multiplied by however many mobs the
  # party kills: at two draws a corridor of eight zombies out-earns a room chest, and the chest is
  # the thing players are supposed to be looking for.
  mob_drop:
    rolls: 1

  # The boss. More draws and a heavier lean than a room chest, and it still scales with difficulty:
  #
  #     easy 23% rare+   ->   medium 41%   ->   hard 58%      (room chest: 11 -> 19 -> 28)
  #
  # The gap to a room chest widened when the base split was thinned, and that is the intended
  # direction: the boss chest is EARNED, so it should be where the top end actually lives.
  #
  # The ONLY table that can produce a mythic, and the weight is deliberately tiny: 3 in 1000 per
  # draw, which over 4-6 draws is roughly one boss chest in 67 at easy, 1 in 40 at medium and
  # 1 in 25 at hard. A mythic is meant to be a thing that happens to somebody else.
  #
  # Where those numbers come from, and the trap in writing your own: common has to be able to PAY
  # for the increase. At multiplier m the rare classes want (m - 1) x their total, and common is
  # the only source. So keep
  #
  #     common  >=  (highest multiplier - 1)  x  (rare + ultra_rare + legendary + mythic)
  #
  # Below that line, common bottoms out at zero and every multiplier past that point produces the
  # SAME table - medium and hard become identical and nothing says so in play. Here that line is
  # 1.5 x 233 = 350, and common is 617, so hard applies in full with room to spare.
  boss_chest:
    rolls: [4, 6]
    rarity:
      common: 617
      uncommon: 150
      rare: 160
      ultra_rare: 55
      legendary: 15
      mythic: 3

# ===============================================================================================
# CHESTS - where the loot actually ends up
#
# HYBRID, AND THE MAPPER WINS. A room whose schematic contains chests has THOSE chests filled -
# all of them, wherever they were built. Only a room with none gets one placed. The person who
# built the room knows where a chest belongs in it; a procedural search that overruled them would
# stand the treasure in the open next to the alcove they carved for it.
#
# Two chests in a room means two chests, each rolled in full. Splitting one roll between them
# would make both disappointing. A double chest is the exception and barely one: its halves share
# an inventory, a player opens it once, so it counts as a single chest.
#
# Anything already inside a chest is left alone. A mapper who pre-loaded one with a story item
# meant it to be there.
chests:

  # Which table a room's chests draw from, by room type.
  #
  # A type that is absent, or blank, is NOT TOUCHED AT ALL - not "given an empty chest". The
  # entrance ships that way: players are teleported into that room and a party gathers there, and
  # a free reward before the first corridor is a different game. If a mapper drew a chest into
  # their entrance hall they get exactly the chest they drew, unstocked.
  #
  # The boss room draws room_chest, NOT boss_chest, and that is deliberate. A hidden chest in the
  # lair is a bonus; giving it the boss's own table would make the reward for killing the boss
  # the second-best thing in the room. boss_chest belongs to the chest that appears where the boss
  # dies (phase 4C) - and it is the only table that can produce a mythic.
  tables:
    entrance: ""
    normal: room_chest
    boss: room_chest

  # Blocks in a schematic that count as "a chest the mapper placed".
  containers: [CHEST, TRAPPED_CHEST, BARREL]

  # Whether a room with no chest of its own gets one. Off means loot appears only where a mapper
  # drew a chest - reasonable once you have a full room set, and empty on a fresh install.
  place-when-missing: true

  # What a placed chest is made of.
  place-material: CHEST

  # Room types that never have a chest PLACED in them, even when they have none of their own.
  # This is not the same as having no table: a mapper's chest in the boss room is still filled.
  # The boss room is here because its reward is the chest that appears where the boss died, and a
  # second chest standing in the corner from the moment the door opens announces the ending before
  # the fight does.
  procedural-skip: [boss]

# ===============================================================================================
# DROPS - what a dungeon mob leaves behind
#
# Two different things happen, and the difference is not size.
#
# An ORDINARY mob may add a roll to the items on the floor. The BOSS does not: its reward is a
# chest that appears where it died. On the floor, a hoard the whole party just fought for goes to
# whoever swung last, can fall into lava or off an edge, and despawns on a timer nobody is
# watching. A chest waits, and everyone can open it. A zombie's three iron nuggets have none of
# those problems, and a chest per zombie would turn a dungeon into a warehouse.
drops:

  # Whether a dungeon mob still drops what it would have dropped outside.
  #
  # OFF by default. Rotten flesh from a dungeon zombie is the mob's own drop, not a reward anyone
  # designed - leave it in and the loot table is only ever part of the answer to "what is farming
  # this worth", with the part nobody configured scaling by how many mobs a room holds. Turn it on
  # if you want the dungeon to feed a survival economy.
  vanilla-drops: false

  # Per mob class: which table a kill rolls, and how often it rolls at all.
  #
  # The CHANCE climbs with the class, not the table. A rarer mob should be worth killing more
  # often, not worth more each time - a table per class would be five tables to balance against
  # each other and five places to get it wrong.
  #
  # There is no 'boss' entry and writing one does nothing: the boss never reaches this path.
  classes:
    weak:         { table: mob_drop, chance: 0.08 }
    normal:       { table: mob_drop, chance: 0.14 }
    strong:       { table: mob_drop, chance: 0.28 }
    super_strong: { table: mob_drop, chance: 0.50 }

  # The boss's reward chest, placed where it fell.
  #
  # This is the ONLY thing that rolls boss_chest, which makes it the only source of a mythic.
  # instance.clear-grace-seconds in config.yml is what keeps the dungeon open long enough to walk
  # over and take it - that setting exists for this chest.
  boss:
    table: boss_chest
    material: CHEST

# A mob may be excluded from all of this per entry: mobs.yml -> dungeonDrops: false. Left unwritten
# the provider decides - true for vanilla, false for MythicMobs, the same rule statOverride uses.

# ===============================================================================================
# ITEMS
#
#   material          a Minecraft item id (DIAMOND_SWORD). An unknown one DISABLES the entry with
#                     a reason on the console - it is never quietly replaced with something else.
#   amount            stack size; a number or a [min, max] range, rolled per draw.
#   name / lore       MiniMessage. Written here rather than in lang/ because an item name is not
#                     the plugin speaking - it is content you authored, next to its weight.
#   enchantments      id: level. Levels ABOVE the vanilla maximum are allowed on purpose: a
#                     legendary capped at Sharpness V is not a legendary.
#   unbreakable       ignores durability.
#   glow              forces the enchantment glint on an item with no enchantment.
#   custom-model-data resource-pack model id.
#   hide              item flags to hide, e.g. [HIDE_ATTRIBUTES, HIDE_ENCHANTS].
#   enabled: false    keeps an entry in the file without it being drawn.
#
# Everything below is vanilla, so a fresh install has a complete, working set with nothing
# disabled - the same out-of-box guarantee mobs.yml makes (anahedef.md section 4).
# ===============================================================================================
items:

  # ------------------------------------------------------------------------------- common
  # What keeps a party going. Nobody remembers finding these; they would notice their absence.

  bread_ration:
    material: BREAD
    class: common
    weight: 150
    amount: [2, 5]

  cooked_meat:
    material: COOKED_BEEF
    class: common
    weight: 120
    amount: [1, 4]

  torch_bundle:
    material: TORCH
    class: common
    weight: 140
    amount: [4, 12]

  arrow_quiver:
    material: ARROW
    class: common
    weight: 130
    amount: [8, 24]

  iron_nugget_pile:
    material: IRON_NUGGET
    class: common
    weight: 90
    amount: [3, 9]

  coal_lump:
    material: COAL
    class: common
    weight: 110
    amount: [2, 6]

  bone_pile:
    material: BONE
    class: common
    weight: 80
    amount: [1, 4]

  # ------------------------------------------------------------------------------- uncommon
  # Worth the detour into a side room.

  iron_ingot_stash:
    material: IRON_INGOT
    class: uncommon
    weight: 140
    amount: [2, 5]

  gold_ingot_stash:
    material: GOLD_INGOT
    class: uncommon
    weight: 110
    amount: [1, 4]

  emerald_shard:
    material: EMERALD
    class: uncommon
    weight: 90
    amount: [1, 3]

  ender_pearl_pouch:
    material: ENDER_PEARL
    class: uncommon
    weight: 70
    amount: [1, 2]

  bottled_experience:
    material: EXPERIENCE_BOTTLE
    class: uncommon
    weight: 85
    amount: [2, 6]

  golden_carrot_ration:
    material: GOLDEN_CARROT
    class: uncommon
    weight: 75
    amount: [2, 4]

  # ------------------------------------------------------------------------------- rare
  # The first tier a player tells someone else about.

  diamond_cache:
    material: DIAMOND
    class: rare
    weight: 120
    amount: [1, 3]

  crypt_blade:
    material: IRON_SWORD
    class: rare
    weight: 100
    name: "<aqua>Crypt Blade</aqua>"
    lore:
      - "<dark_gray>Carried out of a room nobody left.</dark_gray>"
    enchantments:
      sharpness: 3
      unbreaking: 2
    hide: [HIDE_ATTRIBUTES]

  warden_plate:
    material: IRON_CHESTPLATE
    class: rare
    weight: 90
    name: "<aqua>Warden's Plate</aqua>"
    enchantments:
      protection: 3
      unbreaking: 2
    hide: [HIDE_ATTRIBUTES]

  golden_apple_relic:
    material: GOLDEN_APPLE
    class: rare
    weight: 80
    amount: [1, 2]

  tome_of_efficiency:
    material: ENCHANTED_BOOK
    class: rare
    weight: 60
    name: "<light_purple>Tome of the Delver</light_purple>"
    enchantments:
      efficiency: 4
      fortune: 2

  # ------------------------------------------------------------------------------- ultra rare
  # Rare enough that a party stops walking to look at it.

  diamond_greatsword:
    material: DIAMOND_SWORD
    class: ultra_rare
    weight: 100
    name: "<dark_aqua>Deepvein Greatsword</dark_aqua>"
    lore:
      - "<dark_gray>Cut from the seam the dungeon grew around.</dark_gray>"
    enchantments:
      sharpness: 5
      looting: 2
      unbreaking: 3
    hide: [HIDE_ATTRIBUTES]

  diamond_bulwark:
    material: DIAMOND_CHESTPLATE
    class: ultra_rare
    weight: 90
    name: "<dark_aqua>Deepvein Bulwark</dark_aqua>"
    enchantments:
      protection: 4
      unbreaking: 3
      thorns: 2
    hide: [HIDE_ATTRIBUTES]

  longshot_bow:
    material: BOW
    class: ultra_rare
    weight: 80
    name: "<dark_aqua>Longshot</dark_aqua>"
    enchantments:
      power: 5
      infinity: 1
      unbreaking: 3

  netherite_scrap_cache:
    material: NETHERITE_SCRAP
    class: ultra_rare
    weight: 60
    amount: [1, 2]

  # ------------------------------------------------------------------------------- legendary
  # One percent. The point of the whole table is that these exist and are not guaranteed.

  totem_of_the_depths:
    material: TOTEM_OF_UNDYING
    class: legendary
    weight: 100
    name: "<gold><bold>Totem of the Depths</bold></gold>"
    lore:
      - "<dark_gray>Something down here refuses to let go.</dark_gray>"

  netherite_ingot_prize:
    material: NETHERITE_INGOT
    class: legendary
    weight: 90

  godly_apple:
    material: ENCHANTED_GOLDEN_APPLE
    class: legendary
    weight: 70

  bonelords_cleaver:
    material: NETHERITE_AXE
    class: legendary
    weight: 60
    name: "<gradient:#ff5555:#ffaa00><bold>Bonelord's Cleaver</bold></gradient>"
    lore:
      - "<dark_gray>Taken from the hands that made this place.</dark_gray>"
      - "<dark_red>The dungeon remembers you now.</dark_red>"
    unbreakable: true
    enchantments:
      sharpness: 7
      looting: 3
      fire_aspect: 2
    hide: [HIDE_ATTRIBUTES, HIDE_UNBREAKABLE]

  # ------------------------------------------------------------------------------- mythic
  # Boss chests only, and roughly one boss chest in forty at medium. These are chosen to be things
  # a player cannot get on the way to the dungeon: each one normally costs a wither fight, an End
  # journey or a raid on a fortress. That is the bar - a mythic should be a story, not an upgrade.
  #
  # The pool must not be empty. A draw that lands on a class with nothing in it produces NOTHING
  # (see the note above 'tables'), so deleting all three here would quietly void every mythic roll
  # - the console warns at startup, but the roll is still wasted.

  nether_star_prize:
    material: NETHER_STAR
    class: mythic
    weight: 100
    name: "<gradient:#ffffff:#88ddff><bold>Star of the Deep</bold></gradient>"
    lore:
      - "<dark_gray>It was not made here. It was buried here.</dark_gray>"

  elytra_prize:
    material: ELYTRA
    class: mythic
    weight: 70
    name: "<gradient:#c8a2ff:#7a5cff><bold>Wings of the Vault</bold></gradient>"
    lore:
      - "<dark_gray>Whoever wore these last did not make it out either.</dark_gray>"
    unbreakable: true
    hide: [HIDE_UNBREAKABLE]

  dragon_egg_trophy:
    material: DRAGON_EGG
    class: mythic
    weight: 40
    name: "<gradient:#2b0a3d:#a020f0><bold>Dragon Egg</bold></gradient>"
    lore:
      - "<dark_gray>There is no second one.</dark_gray>"
      - "<dark_purple>A trophy. Nothing more, and nothing less.</dark_purple>"
